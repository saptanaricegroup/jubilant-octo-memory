<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบแพ็กสินค้า Realtime</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font-family:Arial,"Noto Sans Thai",sans-serif;color:#172033}
header{background:#2467dc;color:white;padding:20px}.head,.wrap{max-width:1050px;margin:auto}.title{font-size:25px;font-weight:800}.status{margin-top:8px;font-size:13px}
.wrap{padding:14px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0001}
h2{font-size:19px;margin:0 0 12px}label{font-weight:700;display:block;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
select,input,button{font:inherit;padding:12px;border-radius:10px}select,input{width:100%;border:1px solid #d4dbe7;background:white}
button{border:0;background:#2467dc;color:white;font-weight:700;cursor:pointer}.add{display:flex;gap:8px;margin-top:9px}.add button{white-space:nowrap}
.scan{display:flex;gap:8px}.scan button{min-width:150px}
.msg{display:none;margin-top:10px;padding:11px;border-radius:10px;font-weight:700}.show{display:block}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}.stat{background:#f7f9fc;padding:13px;border-radius:11px}.stat b{font-size:26px;display:block;margin-top:4px}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e8ecf2;text-align:left}th{background:#f7f9fc}.scroll{overflow:auto}
@media(max-width:650px){.grid{grid-template-columns:1fr}.scan{display:block}.scan button{width:100%;margin-top:8px}.add{display:block}.add button{width:100%;margin-top:7px}}
</style>
</head>
<body>
<header><div class="head"><div class="title">📦 ระบบเช็กออเดอร์แพ็กสินค้า</div><div id="status" class="status">กำลังเชื่อมต่อ...</div></div></header>
<main class="wrap">

<div class="card">
<h2>👤 พนักงานแพ็กสินค้า</h2>
<label>เลือกพนักงาน</label>
<select id="packer"><option value="">-- เลือกพนักงาน --</option></select>
<div class="add"><input id="newPacker" placeholder="พิมพ์ชื่อพนักงานใหม่"><button onclick="addPacker()">➕ เพิ่มชื่อพนักงาน</button></div>
</div>

<div class="card">
<h2>🚚 ขนส่ง</h2>
<label>เลือกขนส่ง</label>
<select id="carrier"><option value="">-- เลือกขนส่ง --</option></select>
<div class="add"><input id="newCarrier" placeholder="พิมพ์ชื่อขนส่งใหม่"><button onclick="addCarrier()">➕ เพิ่มขนส่ง</button></div>
</div>

<div class="card">
<h2>📷 ยิงบาร์โค้ด / เลขคำสั่งซื้อ</h2>
<div class="scan"><input id="order" autofocus placeholder="ยิงบาร์โค้ดแล้วกด Enter"><button onclick="saveOrder()">บันทึกออเดอร์</button></div>
<div id="msg" class="msg"></div>
</div>

<div class="card">
<h2>📊 สรุปยอด</h2>
<div id="stats" class="stats"></div>
</div>

<div class="card">
<h2>📋 ประวัติออเดอร์</h2>
<input id="search" placeholder="ค้นหาเลขออเดอร์ / คนแพ็ก / ขนส่ง" oninput="render()">
<div class="scroll" style="margin-top:10px"><table><thead><tr><th>เลขออเดอร์</th><th>คนแพ็ก</th><th>ขนส่ง</th><th>วันเวลา</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL='https://leznuprnfzrlgzcuskfb.supabase.co';
const KEY='sb_publishable_U0dXOgS4xoGKlqEmtTruLg_cOt07HLR';
const db=supabase.createClient(URL,KEY);
let people=[],carriers=[],orders=[];

const $=x=>document.getElementById(x);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function notify(t,ok){$('msg').textContent=t;$('msg').className='msg show '+(ok?'ok':'err');setTimeout(()=>$('msg').className='msg',4000)}
function render(){
  const pv=$('packer').value,cv=$('carrier').value;
  $('packer').innerHTML='<option value="">-- เลือกพนักงาน --</option>'+people.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');
  $('carrier').innerHTML='<option value="">-- เลือกขนส่ง --</option>'+carriers.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');
  if(people.some(x=>x.name===pv))$('packer').value=pv;if(carriers.some(x=>x.name===cv))$('carrier').value=cv;
  const q=$('search').value.trim().toLowerCase();
  const list=orders.filter(x=>!q||[x.order_no,x.packer_name,x.carrier_name].some(v=>String(v||'').toLowerCase().includes(q)));
  $('rows').innerHTML=list.map(x=>`<tr><td><b>${esc(x.order_no)}</b></td><td>${esc(x.packer_name)}</td><td>${esc(x.carrier_name)}</td><td>${new Date(x.created_at).toLocaleString('th-TH')}</td></tr>`).join('')||'<tr><td colspan="4">ยังไม่มีข้อมูล</td></tr>';
  const pc={};orders.forEach(x=>pc[x.packer_name]=(pc[x.packer_name]||0)+1);
  $('stats').innerHTML=`<div class="stat">📦 ทั้งหมด<b>${orders.length}</b></div>`+people.map(x=>`<div class="stat">👤 ${esc(x.name)}<b>${pc[x.name]||0}</b></div>`).join('');
}
async function load(){
  const [p,c,o]=await Promise.all([
    db.from('packing_people').select('id,name,active').eq('active',true).order('name'),
    db.from('carriers').select('id,name,active').eq('active',true).order('name'),
    db.from('packing_records').select('*').order('created_at',{ascending:false})
  ]);
  if(p.error||c.error||o.error){$('status').textContent='🔴 เชื่อมต่อไม่ได้: '+(p.error||c.error||o.error).message;return}
  people=p.data||[];carriers=c.data||[];orders=o.data||[];
  $('status').textContent='🟢 ออนไลน์ • Realtime';
  render();
  db.channel('packing-all')
    .on('postgres_changes',{event:'*',schema:'public',table:'packing_people'},e=>{if(e.eventType==='INSERT'&&!people.some(x=>x.id===e.new.id))people.push(e.new);render()})
    .on('postgres_changes',{event:'*',schema:'public',table:'carriers'},e=>{if(e.eventType==='INSERT'&&!carriers.some(x=>x.id===e.new.id))carriers.push(e.new);render()})
    .on('postgres_changes',{event:'*',schema:'public',table:'packing_records'},e=>{if(e.eventType==='INSERT'&&!orders.some(x=>x.id===e.new.id))orders.unshift(e.new);render()})
    .subscribe();
}
async function addPacker(){
  const name=$('newPacker').value.trim();if(!name)return notify('กรุณาพิมพ์ชื่อพนักงาน',false);
  if(people.some(x=>x.name===name))return notify('มีชื่อนี้แล้ว',false);
  const {data,error}=await db.from('packing_people').insert({name:name,active:true}).select().single();
  if(error)return notify('เพิ่มชื่อไม่ได้: '+error.message,false);
  people.push(data);$('newPacker').value='';render();$('packer').value=name;notify('เพิ่มชื่อพนักงานเรียบร้อย',true);
}
async function addCarrier(){
  const name=$('newCarrier').value.trim();if(!name)return notify('กรุณาพิมพ์ชื่อขนส่ง',false);
  if(carriers.some(x=>x.name===name))return notify('มีขนส่งนี้แล้ว',false);
  const {data,error}=await db.from('carriers').insert({name:name,active:true}).select().single();
  if(error)return notify('เพิ่มขนส่งไม่ได้: '+error.message,false);
  carriers.push(data);$('newCarrier').value='';render();$('carrier').value=name;notify('เพิ่มขนส่งเรียบร้อย',true);
}
async function saveOrder(){
  const order=$('order').value.trim(),packer=$('packer').value,carrier=$('carrier').value;
  if(!packer)return notify('กรุณาเลือกพนักงานแพ็กก่อน',false);
  if(!carrier)return notify('กรุณาเลือกขนส่งก่อน',false);
  if(!order)return notify('กรุณายิงบาร์โค้ดก่อน',false);
  const {data,error}=await db.from('packing_records').insert({order_no:order,barcode:order,packer_name:packer,carrier_name:carrier,qty:1}).select().single();
  if(error)return notify(error.code==='23505'?'เลขออเดอร์นี้มีอยู่แล้ว':'บันทึกไม่ได้: '+error.message,false);
  orders.unshift(data);$('order').value='';render();notify('บันทึกออเดอร์เรียบร้อย',true);$('order').focus();
}
$('order').addEventListener('keydown',e=>{if(e.key==='Enter')saveOrder()});
$('newPacker').addEventListener('keydown',e=>{if(e.key==='Enter')addPacker()});
$('newCarrier').addEventListener('keydown',e=>{if(e.key==='Enter')addCarrier()});
load();
</script>
</body></html>
